<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Natalina | Galeria / Ofertas</title>
    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <header>
        <div class="logo-area">
            <img src="img/logo.png" alt="Logotipo da Loja Natalina" class="logo">
            <h2>Magia de Natal</h2>
        </div>
        <button class="btn-menu" aria-label="Abrir menu">☰</button>
        <nav class="menu">
        <a href="index.html">Home</a>
        <a href="produtos.html">Produtos</a>
        <a href="sobre.html">Sobre nós</a>
        <a href="galeria.html" class="ativo">Galeria / Ofertas</a>
        <a href="contato.html">Contato</a>
        </nav>
        <button id="btn-musica" class="btn-natal">🎵 Tocar Música</button>
    </header>

    <main>
        <section class="galeria-container revelar">
            <h1>Galeria de Natal & Ofertas</h1>
            <p>Clique em uma imagem para ampliá-la em nossa galeria lightbox!</p>

            <div class="galeria-grid">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7WHgDiD3MVY7PYehbR0y2gEguPZRK_FRza4u7mUgGEq2b_l62BvpaY1A&s=10" alt="Árvore Iluminada" class="lightbox-img">
                <img src="https://static.itdg.com.br/images/640-400/836f73cfd6ef6b5ebf438859badf1ad2/shutterstock-773802529-1-1-.jpg" alt="Biscoitos Gourmet" class="lightbox-img">
                <img src="https://images.tcdn.com.br/img/img_prod/1095028/cj_3_caixas_presente_natal_rstica_lao_c_led_302520_1_20260915173245_4c5dafd777da.jpeg" alt="Presentes Decorados" class="lightbox-img">
                <img src="https://m.media-amazon.com/images/I/61rqdOEartL._AC_UF894,1000_QL80_.jpg" alt="Velas e Luzes" class="lightbox-img">
            </div>
        </section>

        <div id="modal-lightbox" class="modal">
            <span class="fechar-modal">&times;</span>
            <img class="modal-conteudo" id="img-modal">
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Loja Natalina Magia de Natal. Todos os direitos reservados.</p>
    </footer>

    <button id="topo" title="Voltar ao topo">↑</button>
